# ==============================================================================
# CONFIGURAÇÃO GERAL (Todos os ambientes)
# ==============================================================================
quarkus.http.port=8081

# Banco H2 em memória
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:produtodb;DB_CLOSE_DELAY=-1

# Observabilidade: Health (/q/health) e Métricas (/q/metrics)
quarkus.smallrye-health.root-path=/q/health
quarkus.micrometer.export.prometheus.enabled=true
quarkus.micrometer.export.prometheus.path=/q/metrics

# ==============================================================================
# PERFIL DEV (%dev)
# ==============================================================================
%dev.quarkus.hibernate-orm.database.generation=drop-and-create
%dev.quarkus.hibernate-orm.sql-load-script=import.sql
%dev.quarkus.log.level=INFO
%dev.quarkus.hibernate-orm.log.sql=true

# ==============================================================================
# PERFIL TEST (%test)
# ==============================================================================
%test.quarkus.hibernate-orm.database.generation=drop-and-create
%test.quarkus.hibernate-orm.sql-load-script=import.sql
%test.quarkus.log.level=WARN

# ==============================================================================
# PERFIL PROD (%prod) - Atende ao nível 3: sem recriação destrutiva ou carga fictícia
# ==============================================================================
%prod.quarkus.hibernate-orm.database.generation=update
%prod.quarkus.log.level=INFO