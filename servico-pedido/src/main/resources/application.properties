# ==============================================================================
# CONFIGURAÇÃO GERAL (Todos os ambientes)
# ==============================================================================
quarkus.http.port=8080

# Banco H2 em memória
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:pedidodb;DB_CLOSE_DELAY=-1

# Observabilidade: Health (/q/health) e Métricas (/q/metrics)
quarkus.smallrye-health.root-path=/q/health
quarkus.micrometer.export.prometheus.enabled=true
quarkus.micrometer.export.prometheus.path=/q/metrics

# Porta de teste aleatória (evita conflito com servico-produto na 8081)
quarkus.http.test-port=0

# Localidade Padrão
quarkus.default-locale=pt-BR

# Basic Auth
quarkus.http.auth.basic=true

# URL do servico-produto via configKey = "produtos" (sobrescrevível via QUARKUS_REST_CLIENT_PRODUTOS_URL)
quarkus.rest-client.produtos.url=http://localhost:8081

# Parâmetros de Fault Tolerance externalizados (vence as anotações)
br.gov.caixa.webmarket.pedido.infrastructure.client.ProdutoGateway/confirmarDisponibilidade/Timeout/value=500
br.gov.caixa.webmarket.pedido.infrastructure.client.ProdutoGateway/confirmarDisponibilidade/Retry/maxRetries=2
br.gov.caixa.webmarket.pedido.infrastructure.client.ProdutoGateway/confirmarDisponibilidade/CircuitBreaker/requestVolumeThreshold=4

# ==============================================================================
# PERFIL DEV (%dev)
# ==============================================================================
%dev.quarkus.hibernate-orm.database.generation=drop-and-create
%dev.quarkus.hibernate-orm.sql-load-script=import.sql
%dev.quarkus.log.level=INFO
%dev.quarkus.hibernate-orm.log.sql=true

# ==============================================================================
# PERFIL TEST (%test)
# ==============================================================================
%test.quarkus.hibernate-orm.database.generation=drop-and-create
%test.quarkus.hibernate-orm.sql-load-script=import.sql
%test.quarkus.log.level=WARN

# ==============================================================================
# PERFIL PROD (%prod) - Atende ao nível 3: sem recriação destrutiva ou carga fictícia
# ==============================================================================
%prod.quarkus.hibernate-orm.database.generation=update
%prod.quarkus.log.level=INFO