quarkus.application.name=pedido-api
quarkus.http.port=8081
quarkus.index-dependency.contracts.group-id=br.gov.caixa
quarkus.index-dependency.contracts.artifact-id=shared-contracts
quarkus.rest-client.gravador.url=${GRAVADOR_URL:http://localhost:8082}
quarkus.rest-client.gravador.connect-timeout=2000
quarkus.rest-client.gravador.read-timeout=5000
quarkus.rabbitmq.devservices.enabled=false
quarkus.kafka.devservices.enabled=false
rabbitmq-host=${RABBIT_HOST:localhost}
rabbitmq-port=${RABBIT_PORT:5672}
rabbitmq-username=${RABBIT_USER:webmarket}
rabbitmq-password=${RABBIT_PASS:webmarket}
mp.messaging.outgoing.gravacao.connector=smallrye-rabbitmq
mp.messaging.outgoing.gravacao.exchange.name=gravacao.ex
mp.messaging.outgoing.gravacao.exchange.type=direct
mp.messaging.outgoing.gravacao.default-routing-key=gravacao
mp.messaging.outgoing.gravacao.publish-confirms=true
kafka.bootstrap.servers=${KAFKA:localhost:9092}
mp.messaging.incoming.pedidos-gravados.connector=smallrye-kafka
mp.messaging.incoming.pedidos-gravados.topic=pedido-gravado
mp.messaging.incoming.pedidos-gravados.group.id=pedido-api
mp.messaging.incoming.pedidos-gravados.auto.offset.reset=earliest
mp.messaging.incoming.pedidos-gravados.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.pedidos-gravados.value.deserializer=br.gov.caixa.webmarket.api.infrastructure.messaging.PedidoGravadoDeserializer