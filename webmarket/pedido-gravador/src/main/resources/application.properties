quarkus.application.name=pedido-gravador
quarkus.http.port=8082
quarkus.datasource.db-kind=h2
quarkus.datasource.username=sa
quarkus.datasource.password=
quarkus.datasource.jdbc.url=${PEDIDOS_JDBC_URL:jdbc:h2:file:./data/pedidos;DB_CLOSE_ON_EXIT=FALSE}
quarkus.hibernate-orm.database.generation=update
quarkus.index-dependency.contracts.group-id=br.gov.caixa
quarkus.index-dependency.contracts.artifact-id=shared-contracts
quarkus.datasource.devservices.enabled=false
quarkus.rabbitmq.devservices.enabled=false
quarkus.kafka.devservices.enabled=false
rabbitmq-host=${RABBIT_HOST:localhost}
rabbitmq-port=${RABBIT_PORT:5672}
rabbitmq-username=${RABBIT_USER:webmarket}
rabbitmq-password=${RABBIT_PASS:webmarket}
mp.messaging.incoming.gravacao.connector=smallrye-rabbitmq
mp.messaging.incoming.gravacao.exchange.name=gravacao.ex
mp.messaging.incoming.gravacao.exchange.type=direct
mp.messaging.incoming.gravacao.queue.name=gravacao.q
mp.messaging.incoming.gravacao.routing-keys=gravacao
mp.messaging.incoming.gravacao.auto-bind-dlq=true
mp.messaging.incoming.gravacao.dead-letter-exchange=gravacao.dlx
mp.messaging.incoming.gravacao.dead-letter-exchange-type=fanout
mp.messaging.incoming.gravacao.dead-letter-queue-name=gravacao.dlq
mp.messaging.incoming.gravacao.dlx.declare=true
mp.messaging.incoming.gravacao.failure-strategy=reject
kafka.bootstrap.servers=${KAFKA:localhost:9092}
mp.messaging.outgoing.pedidos-gravados.connector=smallrye-kafka
mp.messaging.outgoing.pedidos-gravados.topic=pedido-gravado
mp.messaging.outgoing.pedidos-gravados.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.pedidos-gravados.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer
mp.messaging.outgoing.pedidos-gravados.acks=all
mp.messaging.outgoing.pedidos-gravados.enable.idempotence=true